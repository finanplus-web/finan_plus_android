#
# Compila e testa o Finan+ para Android a cada envio (push/pull request) e a cada tag de versão.
# Não assina nem publica nada: o app é distribuído pelo F-Droid, que compila este código e assina
# o APK com a chave dele. Por isso este fluxo não usa Secrets.
# Também gera o APK de release sem assinatura, o mesmo build que o F-Droid faz, para conferir
# antes de criar a tag que o F-Droid vai usar.
name: Compilar e testar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # já vem com o Android SDK
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes, APK de teste e APK de release (sem assinatura, como no F-Droid)
        run: |
          set -o pipefail
          # erros de compilação e de teste também como avisos da execução (visíveis sem abrir o log)
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee gradle.log || {
            grep -E "^e: |What went wrong|> .*FAILED|Could not resolve|Exception|expected:" gradle.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Conferir a versão da tag
        if: github.ref_type == 'tag'
        run: |
          V=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $V do app/build.gradle.kts. O F-Droid não vai aceitar."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME confere com a versão $V."

      - name: Conferir os textos do F-Droid
        run: |
          ok=true
          VC=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          for d in fastlane/metadata/android/*/; do
            s=$(tr -d '\n' < "$d/short_description.txt" | wc -m)
            [ "$s" -le 80 ] || { echo "::error::$d/short_description.txt tem $s caracteres (máximo 80)"; ok=false; }
            c="$d/changelogs/$VC.txt"
            if [ -f "$c" ]; then
              n=$(wc -m < "$c"); [ "$n" -le 500 ] || { echo "::error::$c tem $n caracteres (máximo 500)"; ok=false; }
            else
              echo "::warning::Falta $c (notas da versão $VC no F-Droid)"
            fi
          done
          $ok

      - name: Guardar os APKs (artefato da execução)
        uses: actions/upload-artifact@v4
        with:
          name: finan-plus-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
