# SPDX-License-Identifier: GPL-3.0-or-later
#
# Compila e testa o Finan+ para Android a cada envio (push/pull request).
# Publicação automática: quando chega na main uma versão (versionName em app/build.gradle.kts) que ainda
# não tem Release, o fluxo gera o APK assinado e cria a tag vX.Y.Z e a Release com as notas do CHANGELOG.md.
# A assinatura usa a chave guardada nos Secrets do repositório (ver README, "Publicar no GitHub").
# Sem os Secrets, nada é publicado: o APK de teste fica só como artefato da execução.
name: Compilar e publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necessário só para criar a Release

jobs:
  build:
    runs-on: ubuntu-24.04   # já vem com o Android SDK
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK de teste
        run: |
          set -o pipefail
          # erros de compilação e de teste também como avisos da execução (visíveis sem abrir o log)
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee gradle.log || {
            grep -E "^e: |What went wrong|> .*FAILED|Could not resolve|Exception|expected:" gradle.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Guardar o APK de teste (artefato da execução)
        uses: actions/upload-artifact@v4
        with:
          name: finan-plus-apk-de-teste
          path: app/build/outputs/apk/debug/*.apk

      - name: Versão e decisão de publicar
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          V=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          PUBLISH=false
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if [ "v$V" != "$GITHUB_REF_NAME" ]; then
              echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $V do app/build.gradle.kts"; exit 1
            fi
            PUBLISH=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then
            gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || PUBLISH=true
          fi
          if [ "$PUBLISH" = true ] && [ "$HAS_KEY" != true ]; then
            echo "::warning::Versão $V nova, mas os Secrets da chave de assinatura não estão configurados: nada foi publicado (ver README)."
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Versão $V — publicar: $PUBLISH"

      - name: APK assinado
        if: steps.ver.outputs.publish == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FINAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export FINAN_KEYSTORE_FILE="$RUNNER_TEMP/finan-plus.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$FINAN_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$FINAN_KEYSTORE_FILE"
          V=${{ steps.ver.outputs.version }}
          cp app/build/outputs/apk/release/app-release.apk "finan-plus_${V}.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "finan-plus_${V}.apk" | head -3

      - name: Notas da versão
        if: steps.ver.outputs.publish == 'true'
        run: |
          V=${{ steps.ver.outputs.version }}
          awk -v v="$V" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notas.md
          printf '\n---\n**Instalar:** baixe o `finan-plus_%s.apk` abaixo e abra no celular (Android 8.0 ou mais novo). Se o Android pedir, permita instalar apps desta fonte.\n' "$V" >> notas.md

      - name: Criar Release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "finan-plus_${V}.apk" --clobber
          else
            gh release create "v$V" "finan-plus_${V}.apk" --target "$GITHUB_SHA" \
              --title "Finan+ para Android $V" --notes-file notas.md
          fi
