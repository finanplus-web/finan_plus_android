#
# Compila e testa o Finan+ para Android a cada envio (push/pull request) e a cada tag de versão.
# Também gera o APK de release sem assinatura, o mesmo build que o F-Droid faz.
#
# Publicação no GitHub (job "publicar"): numa tag vX.Y.Z, ou manualmente em
# Actions › Compilar e testar › Run workflow (informando a tag), gera o APK assinado com a chave
# do autor e o anexa à Release da tag. A chave fica nos Secrets do repositório (ver README).
# Sem os Secrets, nada é publicado. O F-Droid não usa este APK: ele compila e assina com a chave dele.
name: Compilar e testar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já existente para publicar o APK assinado (ex.: v1.1.2). Vazio: só compila e testa.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # já vem com o Android SDK
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes, APK de teste e APK de release (sem assinatura, como no F-Droid)
        run: |
          set -o pipefail
          # erros de compilação e de teste também como avisos da execução (visíveis sem abrir o log)
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee gradle.log || {
            grep -E "^e: |What went wrong|> .*FAILED|Could not resolve|Exception|expected:" gradle.log | head -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Conferir a versão da tag
        if: github.ref_type == 'tag'
        run: |
          V=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $V do app/build.gradle.kts. O F-Droid não vai aceitar."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME confere com a versão $V."

      - name: Conferir os textos do F-Droid
        run: |
          ok=true
          VC=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          for d in fastlane/metadata/android/*/; do
            s=$(tr -d '\n' < "$d/short_description.txt" | wc -m)
            [ "$s" -le 80 ] || { echo "::error::$d/short_description.txt tem $s caracteres (máximo 80)"; ok=false; }
            c="$d/changelogs/$VC.txt"
            if [ -f "$c" ]; then
              n=$(wc -m < "$c"); [ "$n" -le 500 ] || { echo "::error::$c tem $n caracteres (máximo 500)"; ok=false; }
            else
              echo "::warning::Falta $c (notas da versão $VC no F-Droid)"
            fi
          done
          $ok

      - name: Guardar os APKs (artefato da execução)
        uses: actions/upload-artifact@v4
        with:
          name: finan-plus-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  publicar:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # para criar a Release e anexar o APK
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - name: Conferir se a chave está configurada
        id: chave
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::warning::Os Secrets da chave de assinatura não estão configurados: nenhum APK foi publicado (ver README, 'Publicar no GitHub')."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.chave.outputs.ok == 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        if: steps.chave.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.chave.outputs.ok == 'true'

      - name: Versão
        if: steps.chave.outputs.ok == 'true'
        id: ver
        run: |
          V=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$V" != "$TAG" ]; then
            echo "::error::A tag $TAG não bate com a versão $V do app/build.gradle.kts"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: APK assinado
        if: steps.chave.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FINAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FINAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINAN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          export FINAN_KEYSTORE_FILE="$RUNNER_TEMP/finan-plus.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$FINAN_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$FINAN_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "finan-plus_${V}.apk"
          # o runner tem várias versões do build-tools: usa só a mais nova (o glob direto passava todas como argumentos)
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo "Certificado de assinatura:"
          "$APKSIGNER" verify --print-certs "finan-plus_${V}.apk"

      - name: Notas da versão
        if: steps.chave.outputs.ok == 'true'
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="$V" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notas.md
          printf '\n---\n**Instalar:** baixe o `finan-plus_%s.apk` abaixo e abra no celular (Android 8.0 ou mais novo).\n\n**Atenção:** este APK é assinado pelo autor. A versão do F-Droid é assinada pelo F-Droid. Para trocar de uma para a outra é preciso desinstalar o app; faça antes o *Backup JSON* em Ajustes › Dados.\n' "$V" >> notas.md

      - name: Criar ou atualizar a Release
        if: steps.chave.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "finan-plus_${V}.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "finan-plus_${V}.apk" --repo "$GITHUB_REPOSITORY" \
              --title "Finan+ para Android $V" --notes-file notas.md
          fi
